name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build TotvSheet/TotvSheet.csproj -c Release

      - name: Publish
        run: dotnet publish TotvSheet/TotvSheet.csproj -c Release -o publish --no-build

      - name: Upload published site
        uses: actions/upload-artifact@v4
        with:
          name: valiant-sheet-site
          path: publish/wwwroot
          if-no-files-found: error
